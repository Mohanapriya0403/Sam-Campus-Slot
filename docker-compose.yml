services:

  mongodb:
    image: mongo:7
    container_name: sam-campus-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./server
    container_name: sam-campus-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - mongodb

  frontend:
    build: .
    container_name: sam-campus-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mongodb_data: